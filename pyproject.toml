[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-drift-watch"
version = "0.1.0"
description = "Offline MCP configuration snapshot and security drift reporter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
mcp-drift = "mcp_drift_watch:main"

[tool.setuptools]
py-modules = ["mcp_drift_watch"]
